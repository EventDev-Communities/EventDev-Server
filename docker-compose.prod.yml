services:
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache-prod
    env_file:
      - .env
    restart: always
    expose:
      - "${REDIS_PORT}"
    volumes:
      - redis-cache-prod-data:/data
    networks:
      - eventdev-prod-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db-prod
    env_file:
      - .env
    restart: always
    expose:
      - "5432"
    volumes:
      - postgres-db-prod-data:/var/lib/postgresql/data
      - ./.docker/postgres/init-prod.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eventdev-prod-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: .docker/node/Dockerfile.prod
      target: app
      args:
        - NODE_ENV=production
    container_name: api-prod
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "${NODE_PORT}"
    environment:
      - VIRTUAL_HOST=api.eventdev.org
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis-cache
      - REDIS_PORT=${REDIS_PORT}
      - NODE_PORT=${NODE_PORT}
      - NODE_ENV=production
      - SUPERTOKENS_CONNECTION_URI=http://supertokens-auth:${SUPERTOKENS_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NODE_PORT}/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      redis-cache:
        condition: service_started
      postgres-db:
        condition: service_healthy
      supertokens-auth:
        condition: service_started
    networks:
      - eventdev-prod-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M


  supertokens-auth:
    image: supertokens/supertokens-postgresql
    container_name: supertokens-auth-prod
    restart: unless-stopped
    expose:
      - "${SUPERTOKENS_PORT}"
    environment:
      - POSTGRESQL_HOST=postgres-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE_NAME=supertokens_prod
      - POSTGRESQL_TABLE_NAMES_PREFIX=st_
      - ACCESS_TOKEN_VALIDITY=3600 # 1 hora
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - eventdev-prod-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres-db-prod-data:
  redis-cache-prod-data:

networks:
  eventdev-prod-network:
    external: true
    name: eventdev-prod-network
